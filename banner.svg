<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29"/>
      <stop offset="50%" stop-color="#302B63"/>
      <stop offset="100%" stop-color="#24243E"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Étoiles décoratives -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="100" cy="50" r="1.5"/>
    <circle cx="250" cy="80" r="1"/>
    <circle cx="400" cy="40" r="1.2"/>
    <circle cx="550" cy="60" r="1"/>
    <circle cx="700" cy="35" r="1.4"/>
    <circle cx="900" cy="55" r="1"/>
    <circle cx="1050" cy="80" r="1.3"/>
    <circle cx="1150" cy="45" r="1"/>
    <circle cx="150" cy="220" r="1.2"/>
    <circle cx="350" cy="240" r="1"/>
    <circle cx="600" cy="230" r="1.4"/>
    <circle cx="850" cy="245" r="1"/>
    <circle cx="1080" cy="225" r="1.2"/>
  </g>

  <!-- Lignes décoratives -->
  <g stroke="#A78BFA" stroke-width="1" opacity="0.2">
    <line x1="0" y1="140" x2="80" y2="140"/>
    <line x1="1120" y1="140" x2="1200" y2="140"/>
  </g>

  <!-- Titre principal -->
  <text x="600" y="135"
        font-family="'Fira Code', 'Courier New', monospace"
        font-size="78"
        font-weight="700"
        fill="url(#textGrad)"
        text-anchor="middle"
        filter="url(#glow)">
    SoLeQz
  </text>

  <!-- Sous-titre -->
  <text x="600" y="180"
        font-family="'Fira Code', 'Courier New', monospace"
        font-size="20"
        fill="#E0E7FF"
        text-anchor="middle"
        letter-spacing="3">
    42 student · low-level &amp; systems
  </text>

  <!-- Tags -->
  <g font-family="'Fira Code', monospace" font-size="14" font-weight="500">
    <g transform="translate(440, 215)">
      <rect width="60" height="28" rx="14" fill="#A78BFA" opacity="0.2" stroke="#A78BFA" stroke-width="1"/>
      <text x="30" y="19" fill="#C4B5FD" text-anchor="middle">C</text>
    </g>
    <g transform="translate(510, 215)">
      <rect width="60" height="28" rx="14" fill="#A78BFA" opacity="0.2" stroke="#A78BFA" stroke-width="1"/>
      <text x="30" y="19" fill="#C4B5FD" text-anchor="middle">C++</text>
    </g>
    <g transform="translate(580, 215)">
      <rect width="90" height="28" rx="14" fill="#EC4899" opacity="0.2" stroke="#EC4899" stroke-width="1"/>
      <text x="45" y="19" fill="#F9A8D4" text-anchor="middle">Systems</text>
    </g>
    <g transform="translate(680, 215)">
      <rect width="80" height="28" rx="14" fill="#EC4899" opacity="0.2" stroke="#EC4899" stroke-width="1"/>
      <text x="40" y="19" fill="#F9A8D4" text-anchor="middle">Docker</text>
    </g>
  </g>
</svg>
